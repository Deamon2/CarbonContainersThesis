global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'lxcc'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'carbon-workflow'
    static_configs:
      - targets: ['localhost:9101']

  - job_name: 'process-workflow'
    static_configs:
      - targets: 
        - 'localhost:9102'
        - 'localhost:9103'
        - 'localhost:9104'
        - 'localhost:9105'
        - 'localhost:9106'
        - 'localhost:9107'
